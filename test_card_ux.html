<!doctype html>
<html>
<head>
<style>
  :root {
    --ink: #16263d;
    --paper: #f7f5f0;
    --line: #d6dad8;
    --white: #ffffff;
    --teal: #287375;
    --shadow: 0 24px 70px rgba(22, 38, 61, 0.12);
  }
  body {
    background: var(--paper);
    padding: 50px;
    font-family: sans-serif;
  }
  .naruon-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
  }
  .naruon-grid article {
    min-height: 220px;
    padding: 26px;
    background: var(--white);

    /* UX Improvement */
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  /* Make the whole card clickable via pseudo-element */
  .project-grid h3 a::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* Hover states for the whole card */
  .project-grid article:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(22, 38, 61, 0.08);
    z-index: 2; /* To ensure box-shadow goes over other grid items */
  }

  .project-grid h3 a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
  }
  .project-grid article:hover h3 a {
    color: var(--ink);
    text-decoration-color: var(--ink);
  }

  h3 { color: var(--teal); margin-bottom: 16px; margin-top: 0; }
  p { color: #4f5968; margin: 0; }
</style>
</head>
<body>
  <div class="naruon-grid project-grid">
    <article>
      <h3><a target="_blank" href="#">Naruon</a></h3>
      <p>메일, 첨부, 일정, 작업을 맥락으로 묶어 판단과 실행으로 연결하는 AI 이메일 워크스페이스입니다.</p>
    </article>
    <article>
      <h3><a target="_blank" href="#">pg-erd-cloud</a></h3>
      <p>PostgreSQL 스키마를 리버스 엔지니어링하고 ERD와 DDL 공유 흐름으로 관리하는 클라우드 MVP입니다.</p>
    </article>
  </div>
</body>
</html>
